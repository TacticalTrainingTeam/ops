services:
  website:
    container_name: "${COMPOSE_PROJECT_NAME:?error}"
    build: "https://github.com/TacticalTrainingTeam/ttt-frontend.git"
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
    cap_add:
      - "NET_BIND_SERVICE"
    environment:
      TZ: "Europe/Berlin"
    networks:
      - "proxy"
    labels:
      traefik.enable: true
      traefik.http.routers.website-prod.entrypoints: "websecure-internal,websecure-external"
      traefik.http.routers.website-prod.rule: "Host(`${TRAEFIK_DOMAINNAME_1:?error}`) || Host(`www.${TRAEFIK_DOMAINNAME_1:?error}`)"
      traefik.http.routers.website-prod.service: "website-prod"
      traefik.http.routers.website-prod.middlewares: "redirect-www-to-non-www@docker"
      traefik.http.services.website-prod.loadbalancer.server.port: 80
      traefik.http.middlewares.redirect-www-to-non-www.redirectregex.regex: "^https://www\\.(.*)"
      traefik.http.middlewares.redirect-www-to-non-www.redirectregex.replacement: "https://$$1"
networks:
  proxy:
    external: true
    name: "proxy"